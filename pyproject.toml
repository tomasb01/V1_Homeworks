[project]
name = "tool-calling-homework"
version = "0.1.0"
description = "Homework: LLM tool calling workflow with OpenAI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.19.2",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]  # test_queries.py is a live demo with real API calls, not a unit test
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
